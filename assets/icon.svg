<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Glance Plus">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C9BFF"/>
      <stop offset="0.55" stop-color="#4F6BFF"/>
      <stop offset="1" stop-color="#2F3FD6"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0A1030" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- app body -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#body)"/>
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#gloss)"/>

  <!-- the page underneath: the tab you are on -->
  <g opacity="0.42">
    <rect x="112" y="104" width="212" height="252" rx="26" fill="#FFFFFF"/>
    <rect x="140" y="142" width="118" height="18" rx="9" fill="#1B2350" opacity="0.55"/>
  </g>

  <!-- the page on top: the glance -->
  <g filter="url(#lift)">
    <rect x="186" y="166" width="216" height="252" rx="26" fill="#FFFFFF"/>
    <rect x="216" y="208" width="156" height="17" rx="8.5" fill="#4F6BFF"/>
    <rect x="216" y="244" width="156" height="17" rx="8.5" fill="#4F6BFF" opacity="0.9"/>
    <rect x="216" y="280" width="96" height="17" rx="8.5" fill="#4F6BFF" opacity="0.55"/>
  </g>
</svg>
